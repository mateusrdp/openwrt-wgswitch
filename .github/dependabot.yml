# Keeps the GitHub Actions used by the workflow up to date (weekly PRs).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR for all action updates: the artifact upload/download actions and
    # the Pages upload/deploy actions only work in matching pairs, and several
    # of them only run on release tags, so they're tested together by tagging.
    groups:
      github-actions:
        patterns: [ "*" ]
